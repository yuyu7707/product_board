{% extends "base.html" %}

{% block title %}{{ product.name }} | 八幡平 産直掲示板{% endblock %}

{% block content %}
<article>
    <header><h1>{{ product.name }}</h1></header>
    <p>価格: {{ "{:,}".format(product.price) }}円</p>
    <p>生産者: {{ product.producer_name }}</p>
    <p>{{ product.description }}</p>
    <footer>
        <a href="{{ url_for('edit', product_id=product.id) }}" role="button">編集</a>
        <form action="{{ url_for('delete', product_id=product.id) }}" method="post" onsubmit="return confirm('削除しますか？')">
            <button type="submit" class="secondary">削除</button>
        </form>
    </footer>
</article>
<a href="{{ url_for('index') }}">一覧に戻る</a>
{% endblock %}
